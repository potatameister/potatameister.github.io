<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon-180.png' | relative_url }}">
    <script src="{{ '/assets/script.js' | relative_url }}" defer></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="{{ '/' | relative_url }}" class="nav-brand">potatameister<span class="dot">.</span></a>
            <ul class="nav-links">
                <li><a href="{{ '/apps/' | relative_url }}" class="no-underline">Apps</a></li>
                <li><a href="{{ '/privacy/' | relative_url }}" class="no-underline">Privacy</a></li>
                <li><a href="{{ '/contact/' | relative_url }}" class="no-underline">Contact</a></li>
                <li>
                    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>
    
    <main>
        <div class="container privacy-content">
            {{ content }}
        </div>
    </main>
    
    <footer>
        <div class="container">
            by potatameister
        </div>
    </footer>
</body>
</html>
